<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkout | POWERVAULT</title>
  <meta name="description" content="POWERVAULT checkout demo.">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="pages.css">
</head>
<body>
  <div class="topline"></div>

  <nav class="navbar navbar-expand-lg navbar-dark pv-nav sticky-top">
    <div class="container">
      <a class="navbar-brand brand" href="index.html">
        <img class="brand-logo" src="logo-nav.png" alt="POWERVAULT" width="99" height="64">
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#pvNav" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="pvNav">
        <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-3">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="shop.html">Shop</a></li>
          <li class="nav-item"><a class="nav-link" href="cart.html">Cart <span class="cart-count" data-cart-count>0</span></a></li>
          <li class="nav-item"><a class="nav-link" href="login.html">Login</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main>
    <section class="page-hero compact">
      <div class="container">
        <div class="eyebrow">ALMOST THERE</div>
        <h1>Secure <span class="gradient-text">Checkout</span></h1>
      </div>
    </section>

    <section class="section-pad">
      <div class="container">
        <div class="row g-4">
          <div class="col-lg-7">
            <form id="checkoutForm" class="form-panel checkout-form">
              <h2>Shipping details</h2>
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label">Full name</label>
                  <input class="form-control" name="name" required>
                </div>
                <div class="col-md-6">
                  <label class="form-label">Phone</label>
                  <input class="form-control" name="phone" required>
                </div>
                <div class="col-12">
                  <label class="form-label">City</label>
                  <input class="form-control" name="city" required>
                </div>
                <div class="col-12">
                  <label class="form-label">Address</label>
                  <textarea class="form-control" name="address" rows="3" required></textarea>
                </div>
              </div>

              <h2 class="mt-4">Payment method</h2>
              <label class="payment-option">
                <input type="radio" name="payment" value="cod" checked>
                <span><b>Cash on Delivery</b><small>Pay when your order arrives</small></span>
              </label>
              <label class="payment-option">
                <input type="radio" name="payment" value="easypaisa">
                <span><b>Easypaisa</b><small>Pay via registered phone number</small></span>
              </label>
              <label class="payment-option">
                <input type="radio" name="payment" value="jazzcash">
                <span><b>JazzCash</b><small>Pay via registered phone number</small></span>
              </label>

              <button class="btn btn-neon w-100 mt-3" type="submit">Place Demo Order →</button>
              <p class="muted small mt-3 mb-0">Demo only — real orders need PHP + MySQL hosting.</p>
            </form>
          </div>
          <div class="col-lg-5" id="checkoutSummary"></div>
        </div>
      </div>
    </section>
  </main>

  <footer class="pv-footer">
    <div class="footer-copyright">
      <div class="container">© 2026 POWERVAULT • Built for modern life.</div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
