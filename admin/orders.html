<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orders | POWERVAULT Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="../pages.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body data-admin-page="orders">
  <div class="topline"></div>
  <main class="section-pad admin-shell">
    <div class="container-fluid">
      <div class="admin-topbar container-fluid px-0">
        <a href="../index.html"><img class="brand-logo" src="../logo-nav.png" alt="POWERVAULT"></a>
        <span class="admin-badge">JS Demo Admin</span>
      </div>

      <div class="admin-layout">
        <aside class="admin-sidebar">
          <div class="eyebrow">CONTROL CENTER</div>
          <a href="index.html" data-nav="dashboard">▦ Dashboard</a>
          <a href="products.html" data-nav="products">◇ Products</a>
          <a href="inventory.html" data-nav="inventory">▤ Inventory</a>
          <a href="orders.html" data-nav="orders">⇄ Orders</a>
          <a href="settings.html" data-nav="settings">⚙ Settings</a>
          <a href="#" data-logout>↪ Logout</a>
        </aside>

        <div class="admin-content">
          <div class="section-heading">
            <div>
              <div class="eyebrow">ORDER MANAGEMENT</div>
              <h1>Orders</h1>
              <p class="muted mb-0">Includes Easypaisa / JazzCash wallet details from demo checkout.</p>
            </div>
          </div>

          <div class="dashboard-panel">
            <div class="table-responsive">
              <table class="table pv-table">
                <thead>
                  <tr>
                    <th>Order</th>
                    <th>Customer</th>
                    <th>Payment</th>
                    <th>Total</th>
                    <th>Update</th>
                  </tr>
                </thead>
                <tbody id="ordersBody"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>
  <script src="admin.js"></script>
</body>
</html>
