<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Products | POWERVAULT Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="../pages.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body data-admin-page="products">
  <div class="topline"></div>
  <main class="section-pad admin-shell">
    <div class="container-fluid">
      <div class="admin-topbar container-fluid px-0">
        <a href="../index.html"><img class="brand-logo" src="../logo-nav.png" alt="POWERVAULT"></a>
        <span class="admin-badge">JS Demo Admin</span>
      </div>

      <div class="admin-layout">
        <aside class="admin-sidebar">
          <div class="eyebrow">CONTROL CENTER</div>
          <a href="index.html" data-nav="dashboard">▦ Dashboard</a>
          <a href="products.html" data-nav="products">◇ Products</a>
          <a href="inventory.html" data-nav="inventory">▤ Inventory</a>
          <a href="orders.html" data-nav="orders">⇄ Orders</a>
          <a href="settings.html" data-nav="settings">⚙ Settings</a>
          <a href="#" data-logout>↪ Logout</a>
        </aside>

        <div class="admin-content">
          <div class="section-heading">
            <div>
              <div class="eyebrow">CATALOG MANAGEMENT</div>
              <h1>Products</h1>
            </div>
          </div>

          <div class="row g-4">
            <div class="col-lg-5">
              <form id="productForm" class="form-panel">
                <h2 id="productFormTitle">Add Product</h2>
                <label class="form-label">Name *</label>
                <input class="form-control mb-2" name="name" required>
                <label class="form-label">Category</label>
                <input class="form-control mb-2" name="category" placeholder="Bike Lights">
                <label class="form-label">Description</label>
                <textarea class="form-control mb-2" name="description" rows="3"></textarea>
                <label class="form-label">Image URL / path</label>
                <input class="form-control mb-2" name="image" placeholder="../hero.jpeg">
                <div class="row g-2">
                  <div class="col-4">
                    <label class="form-label">Price</label>
                    <input class="form-control" type="number" name="price" min="0" step="1">
                  </div>
                  <div class="col-4">
                    <label class="form-label">Cost</label>
                    <input class="form-control" type="number" name="cost_price" min="0" step="1">
                  </div>
                  <div class="col-4">
                    <label class="form-label">Stock</label>
                    <input class="form-control" type="number" name="stock" min="0" step="1" value="10">
                  </div>
                </div>
                <div class="d-flex gap-2 mt-3">
                  <button class="btn btn-neon" type="submit">Save Product</button>
                  <button class="btn btn-outline-glow" type="button" id="productReset">Clear</button>
                </div>
              </form>
            </div>
            <div class="col-lg-7">
              <div class="dashboard-panel">
                <h2 class="mb-3">Catalog</h2>
                <div class="table-responsive">
                  <table class="table pv-table">
                    <thead>
                      <tr>
                        <th>Img</th>
                        <th>Product</th>
                        <th>Price</th>
                        <th>Stock</th>
                        <th>Status</th>
                        <th></th>
                      </tr>
                    </thead>
                    <tbody id="productsBody"></tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>
  <script src="admin.js"></script>
</body>
</html>
