<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Login | POWERVAULT</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="../pages.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body data-admin-page="login">
  <div class="topline"></div>
  <nav class="navbar navbar-expand-lg navbar-dark pv-nav">
    <div class="container">
      <a class="navbar-brand brand" href="../index.html">
        <img class="brand-logo" src="../logo-nav.png" alt="POWERVAULT" width="99" height="64">
      </a>
      <a class="nav-link" href="../index.html">← Back to store</a>
    </div>
  </nav>

  <main class="section-pad">
    <div class="container admin-login-wrap">
      <form id="adminLoginForm" class="form-panel auth-card">
        <div class="eyebrow">RESTRICTED ACCESS</div>
        <h1>Admin Login</h1>
        <div class="admin-note">
          Demo admin for GitHub Pages (JavaScript + browser storage).<br>
          <strong>Email:</strong> admin@powervault.pk<br>
          <strong>Password:</strong> Admin@12345
        </div>
        <div id="adminLoginError" class="alert error d-none" role="alert"></div>
        <label class="form-label">Email</label>
        <input class="form-control mb-3" type="email" name="email" required value="admin@powervault.pk">
        <label class="form-label">Password</label>
        <input class="form-control mb-4" type="password" name="password" required value="Admin@12345">
        <button class="btn btn-neon w-100" type="submit">Enter Control Center</button>
      </form>
    </div>
  </main>

  <script src="admin.js"></script>
</body>
</html>
