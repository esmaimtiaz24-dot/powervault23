<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inventory | POWERVAULT Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="../pages.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body data-admin-page="inventory">
  <div class="topline"></div>
  <main class="section-pad admin-shell">
    <div class="container-fluid">
      <div class="admin-topbar container-fluid px-0">
        <a href="../index.html"><img class="brand-logo" src="../logo-nav.png" alt="POWERVAULT"></a>
        <span class="admin-badge">JS Demo Admin</span>
      </div>

      <div class="admin-layout">
        <aside class="admin-sidebar">
          <div class="eyebrow">CONTROL CENTER</div>
          <a href="index.html" data-nav="dashboard">▦ Dashboard</a>
          <a href="products.html" data-nav="products">◇ Products</a>
          <a href="inventory.html" data-nav="inventory">▤ Inventory</a>
          <a href="orders.html" data-nav="orders">⇄ Orders</a>
          <a href="settings.html" data-nav="settings">⚙ Settings</a>
          <a href="#" data-logout>↪ Logout</a>
        </aside>

        <div class="admin-content">
          <div class="section-heading">
            <div>
              <div class="eyebrow">STOCK CONTROL</div>
              <h1>Inventory</h1>
            </div>
          </div>

          <div class="row g-4">
            <div class="col-lg-4">
              <form id="stockForm" class="form-panel">
                <h2>Adjust Stock</h2>
                <label class="form-label">Product</label>
                <select class="form-select mb-2" name="product_id" id="stockProduct" required></select>
                <label class="form-label">Quantity (+/-)</label>
                <input class="form-control mb-2" type="number" name="quantity" required placeholder="e.g. 5 or -2">
                <label class="form-label">Reason</label>
                <input class="form-control mb-3" name="reason" placeholder="Manual adjustment">
                <button class="btn btn-neon w-100" type="submit">Update Stock</button>
              </form>
            </div>
            <div class="col-lg-8">
              <div class="dashboard-panel mb-4">
                <h2 class="mb-3">Current Stock</h2>
                <div class="table-responsive">
                  <table class="table pv-table">
                    <thead><tr><th>Product</th><th>Stock</th><th>Status</th></tr></thead>
                    <tbody id="stockBody"></tbody>
                  </table>
                </div>
              </div>
              <div class="dashboard-panel">
                <h2 class="mb-3">Recent Movements</h2>
                <div class="table-responsive">
                  <table class="table pv-table">
                    <thead><tr><th>Product</th><th>Change</th><th>Reason</th><th>When</th></tr></thead>
                    <tbody id="movesBody"></tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>
  <script src="admin.js"></script>
</body>
</html>
